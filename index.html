<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FTS">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>FTS Arrival</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
:root{
  --ink:#000;--ink1:#0a0a0a;--ink2:#141414;--ink3:#1f1f1f;--ink4:#2a2a2a;
  --ln:rgba(255,255,255,0.08);--ln2:rgba(255,255,255,0.14);
  --fg:#fff;--fg2:#e4e4e4;--fg3:#a0a0a0;--fg4:#555;
  --blue:#0a84ff;--blue2:#409cff;--blue3:#003d99;
  --green:#30d158;--green2:#248a3d;
  --red:#ff453a;--amber:#ffd60a;--orange:#ff9f0a;
  --r:18px;--rp:100px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;font-family:'Inter',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
html{height:100%;background:#000;}
body{width:100%;height:100dvh;overflow:hidden;position:fixed;inset:0;background:#000;color:var(--fg);display:flex;flex-direction:column;}

/* ══ SETUP ══ */
#setup{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;background:#000;}
.setup-mark{width:80px;height:80px;border-radius:24px;background:linear-gradient(145deg,#0055ff,#0a84ff);display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:28px;box-shadow:0 12px 40px rgba(10,132,255,0.45);}
.setup-h{font-size:30px;font-weight:800;letter-spacing:-0.8px;margin-bottom:6px;}
.setup-h span{color:var(--blue2);}
.setup-p{font-size:15px;color:var(--fg3);text-align:center;line-height:1.55;margin-bottom:36px;max-width:280px;}
.field-lbl{width:100%;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--fg4);margin-bottom:7px;}
.field-inp{width:100%;padding:16px 18px;background:var(--ink2);border:1.5px solid var(--ln2);border-radius:var(--r);color:var(--fg);font-size:15px;font-weight:500;margin-bottom:14px;outline:none;transition:border-color .2s;-webkit-user-select:text;user-select:text;}
.field-inp:focus{border-color:var(--blue);}
.field-inp::placeholder{color:var(--fg4);}
.cta{width:100%;padding:18px;border-radius:var(--rp);border:none;background:var(--blue);color:#fff;font-size:17px;font-weight:700;cursor:pointer;touch-action:manipulation;box-shadow:0 6px 24px rgba(10,132,255,0.4);transition:opacity .15s,transform .1s;}
.cta:active{opacity:.85;transform:scale(.98);}
.cta:disabled{opacity:.38;cursor:not-allowed;transform:none;}
.err{margin-top:12px;font-size:13px;color:var(--red);text-align:center;display:none;}
.err.on{display:block;}

/* ══ MAIN APP ══ */
#app{display:none;flex-direction:column;height:100%;overflow:hidden;}
#app.on{display:flex;}

/* Top bar */
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:max(env(safe-area-inset-top),14px) 18px 10px;background:#000;}
.timer-wrap{display:flex;flex-direction:column;}
.timer-lbl{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--fg4);}
#tmr{font-size:34px;font-weight:900;letter-spacing:-1.2px;font-variant-numeric:tabular-nums;color:var(--fg2);line-height:1;transition:color .25s;}
#tmr.run{color:var(--green);}
#tmr.stp{color:var(--red);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.badge{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rp);background:var(--ink2);border:1px solid var(--ln2);font-size:11px;font-weight:700;letter-spacing:.2px;text-transform:uppercase;color:var(--fg3);transition:all .25s;white-space:nowrap;}
.badge.run{background:rgba(48,209,88,.1);border-color:rgba(48,209,88,.28);color:var(--green);}
.badge.stp{background:rgba(255,69,58,.1);border-color:rgba(255,69,58,.28);color:var(--red);}
.dot{width:6px;height:6px;border-radius:50%;background:var(--fg4);flex-shrink:0;transition:background .25s;}
.dot.live{background:var(--green);animation:blink 1.2s infinite;}
.dot.dead{background:var(--red);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
#qb{display:none;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--rp);background:rgba(255,159,10,.1);border:1px solid rgba(255,159,10,.3);font-size:11px;font-weight:700;color:var(--orange);cursor:pointer;touch-action:manipulation;white-space:nowrap;}
#qb.on{display:flex;}
.qbdot{width:6px;height:6px;border-radius:50%;background:var(--orange);animation:blink 1.5s infinite;}

/* ── Grid ── */
.grid-wrap{flex:1 1 0;min-height:0;padding:8px 12px 6px;}
#grid{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:8px;}

.sp{position:relative;border-radius:var(--r);overflow:hidden;border:1.5px solid var(--ln2);background:var(--ink2);cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 8px;text-align:center;transition:transform .1s,border-color .15s;width:100%;height:100%;}
.sp-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
.sp-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.3) 100%);z-index:1;pointer-events:none;}
.sp-name,.sp-time,.sp-n,.sp-etag{position:relative;z-index:2;}
.sp-name{font-size:clamp(11px,3.8vw,15px);font-weight:800;color:var(--fg);line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.95);}
.sp-time{font-size:11px;font-weight:700;color:var(--green);font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(0,0,0,.95);}
.sp-n{position:absolute;top:8px;right:9px;font-size:10px;font-weight:700;color:var(--amber);z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.9);}
.sp-etag{position:absolute;top:7px;left:8px;font-size:9px;font-weight:700;color:var(--blue2);z-index:3;display:none;}
.sp:disabled{opacity:.1;cursor:not-allowed;}
.sp:not(:disabled):not(.hit):not(.em):active{transform:scale(.88);}
.sp.hit{border-color:rgba(48,209,88,.5);}
.sp.hit::after{content:'';position:absolute;inset:0;background:rgba(48,209,88,.14);z-index:1;border-radius:calc(var(--r) - 1px);}
.sp.em{opacity:.1;pointer-events:none;}
.sp.eon{border-color:rgba(10,132,255,.5);background:rgba(10,132,255,.08);pointer-events:auto;opacity:1;}
.sp.eon .sp-etag{display:block;}
.sp.eon:active{transform:scale(.92);}

/* ── Bottom ── */
.btm{flex-shrink:0;padding:8px 12px max(env(safe-area-inset-bottom),14px);background:#000;}
#btnF{display:none;width:100%;padding:17px;margin-bottom:9px;border-radius:var(--rp);border:none;background:var(--blue);color:#fff;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 24px rgba(10,132,255,.32);opacity:.38;pointer-events:none;transition:opacity .2s;}
#btnF.on{display:block;}
#btnF.go{opacity:1;pointer-events:auto;}
#btnF:active{opacity:.82;}
.ctrl{display:grid;grid-template-columns:52px 1fr 52px;gap:9px;align-items:center;}
.circ{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ln2);background:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;touch-action:manipulation;transition:all .15s;}
.circ:active{transform:scale(.91);}
.circ:disabled{opacity:.18;cursor:not-allowed;}
#bSync.hq{border-color:rgba(255,159,10,.4);background:rgba(255,159,10,.1);}
#bGear.on{border-color:rgba(10,132,255,.5);background:rgba(10,132,255,.12);}
.ico{width:22px;height:22px;object-fit:contain;filter:brightness(0) invert(1);opacity:.72;}
#bGear.on .ico{opacity:1;}
.scnt{font-size:10px;font-weight:800;color:var(--orange);display:none;}
.scnt.on{display:block;}
#btnM{height:52px;border-radius:var(--rp);border:none;font-size:17px;font-weight:700;letter-spacing:-.2px;cursor:pointer;touch-action:manipulation;background:var(--green);color:#fff;box-shadow:0 4px 20px rgba(48,209,88,.22);transition:all .15s;}
#btnM.stp{background:var(--red);box-shadow:0 4px 20px rgba(255,69,58,.22);}
#btnM:active{transform:scale(.96);}

/* ══ SHEET OVERLAY ══ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;}
.ov.on{display:flex;}
.sheet{width:100%;max-width:480px;max-height:90dvh;background:var(--ink1);border-radius:26px 26px 0 0;border-top:1px solid var(--ln2);display:flex;flex-direction:column;animation:sup .26s cubic-bezier(.32,.72,0,1);}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh-pull{width:36px;height:4px;border-radius:2px;background:var(--ink4);margin:12px auto 6px;flex-shrink:0;}
.sh-hdr{padding:10px 20px 16px;flex-shrink:0;}
.sh-title{font-size:22px;font-weight:800;letter-spacing:-.5px;}

/* Segment */
.seg{padding:0 16px 2px;flex-shrink:0;}
.seg-inner{display:flex;background:var(--ink3);border-radius:var(--rp);padding:4px;}
.seg-btn{flex:1;padding:11px 8px;border:none;border-radius:var(--rp);font-size:14px;font-weight:600;color:var(--fg3);background:transparent;cursor:pointer;touch-action:manipulation;transition:all .18s;text-align:center;}
.seg-btn.on{background:var(--ink4);color:var(--fg);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.6);}

/* List */
.sh-list{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 4px;display:flex;flex-direction:column;gap:10px;}
.sh-list::-webkit-scrollbar{width:0;}

/* Slot card */
.sl-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--ink2);border-radius:var(--r);border:1px solid var(--ln);}
.sl-thumb{width:96px;height:60px;border-radius:12px;flex-shrink:0;background:var(--ink3);overflow:hidden;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;font-size:22px;border:1.5px dashed rgba(255,255,255,.1);}
.sl-thumb img{width:100%;height:100%;object-fit:cover;display:none;border-radius:10px;}
.sl-thumb img.vis{display:block;}
.sl-body{flex:1;display:flex;flex-direction:column;gap:7px;}
.sl-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--fg4);}
.sl-inp{width:100%;padding:9px 12px;background:var(--ink3);border:1px solid var(--ln);border-radius:12px;color:var(--fg);font-size:15px;font-weight:600;outline:none;-webkit-user-select:text;user-select:text;transition:border-color .2s;}
.sl-inp:focus{border-color:var(--blue);}
.sl-vis-row{display:flex;align-items:center;justify-content:space-between;}
.sl-vis-lbl{font-size:13px;color:var(--fg3);font-weight:500;}
/* iOS toggle */
.tog{position:relative;width:51px;height:31px;flex-shrink:0;}
.tog input{opacity:0;width:0;height:0;position:absolute;}
.tog-tr{position:absolute;inset:0;border-radius:16px;background:var(--ink4);transition:background .2s;cursor:pointer;}
.tog-tr::after{content:'';position:absolute;width:25px;height:25px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 2px 5px rgba(0,0,0,.5);}
.tog input:checked+.tog-tr{background:var(--green);}
.tog input:checked+.tog-tr::after{transform:translateX(20px);}

/* Company card */
.co-card{display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--ink2);border-radius:var(--r);border:1px solid var(--ln);}
.co-logo{width:120px;height:72px;border-radius:12px;flex-shrink:0;background:var(--ink3);overflow:hidden;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--ln);}
.co-logo img{width:100%;height:100%;object-fit:cover;display:block;}
.co-body{flex:1;display:flex;flex-direction:column;gap:5px;}
.co-del{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,69,58,.15);color:var(--red);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;touch-action:manipulation;}
.co-del:active{background:rgba(255,69,58,.3);}
.co-add{display:flex;align-items:center;justify-content:center;gap:8px;padding:18px;border-radius:var(--r);border:1.5px dashed rgba(255,255,255,.1);background:transparent;color:var(--fg3);font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation;}

/* Sheet footer */
.sh-foot{flex-shrink:0;padding:12px 16px max(env(safe-area-inset-bottom),16px);display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;border-top:1px solid var(--ln);}
.foot-back{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ln2);background:var(--ink2);font-size:20px;color:var(--fg2);cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;}
.foot-back:active{opacity:.6;}
.foot-cta{height:52px;border-radius:var(--rp);border:none;font-size:16px;font-weight:700;color:#fff;cursor:pointer;touch-action:manipulation;transition:all .15s;}
.foot-cta.green{background:var(--green);}
.foot-cta.blue{background:var(--blue);}
.foot-cta:active{opacity:.85;transform:scale(.98);}
.foot-cta:disabled{opacity:.35;cursor:not-allowed;transform:none;}

/* ══ CROP ══ */
#cropMod{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;}
#cropMod.on{display:flex;}
.crop-h{font-size:20px;font-weight:800;margin-bottom:20px;letter-spacing:-.3px;}
.crop-frame{position:relative;width:280px;height:180px;border-radius:14px;overflow:hidden;border:2px solid var(--blue);background:#000;flex-shrink:0;touch-action:none;transition:height .2s;}
#cCv{position:absolute;inset:0;cursor:grab;touch-action:none;}
#cCv:active{cursor:grabbing;}
.crop-grid{position:absolute;inset:0;pointer-events:none;border-radius:18px;}
.crop-grid::before,.crop-grid::after{content:'';position:absolute;}
.crop-grid::before{top:33.33%;left:0;right:0;height:1px;background:rgba(255,255,255,.18);box-shadow:0 93.33px 0 rgba(255,255,255,.18);}
.crop-grid::after{left:33.33%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.18);box-shadow:93.33px 0 0 rgba(255,255,255,.18);}
.crop-ring{position:absolute;inset:0;border:2px solid rgba(10,132,255,.6);border-radius:18px;pointer-events:none;}
.crop-hint{font-size:13px;color:var(--fg3);margin:14px 0 4px;text-align:center;}
.crop-slider{width:240px;margin:8px 0 22px;accent-color:var(--blue);}
.crop-btns{display:flex;gap:10px;width:100%;max-width:280px;}
.crop-cancel{flex:1;padding:15px;border-radius:var(--rp);border:1.5px solid var(--ln2);background:transparent;color:var(--fg3);font-size:15px;font-weight:600;cursor:pointer;touch-action:manipulation;}
.crop-ok{flex:2;padding:15px;border-radius:var(--rp);border:none;background:var(--blue);color:#fff;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 18px rgba(10,132,255,.35);}
.crop-cancel:active,.crop-ok:active{opacity:.82;}

/* ══ ROUTE MODAL ══ */
#routeMod{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column;overflow:hidden;}
#routeMod.on{display:flex;}
.rm-hdr{flex-shrink:0;padding:max(env(safe-area-inset-top),18px) 20px 14px;}
.rm-h{font-size:26px;font-weight:900;letter-spacing:-.6px;}
.rm-h em{font-style:normal;color:var(--blue2);}

/* Step tabs */
.stab-wrap{flex-shrink:0;padding:0 16px 14px;}
.stab-bar{display:flex;background:var(--ink2);border-radius:var(--rp);padding:4px;}
.stab{flex:1;padding:10px 6px;border:none;background:transparent;border-radius:var(--rp);font-size:12px;font-weight:600;color:var(--fg3);cursor:pointer;touch-action:manipulation;text-align:center;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:2px;}
.stab.on{background:var(--ink4);color:var(--fg);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.6);}
.stab.done{color:var(--blue2);}
.stab-name{font-size:12px;font-weight:inherit;}
.stab-val{font-size:10px;font-weight:800;color:inherit;min-height:12px;}
.stab.done .stab-val{color:var(--green);}

/* Body */
.rm-body{flex:1 1 0;min-height:0;overflow-y:auto;padding:16px 16px 8px;-webkit-overflow-scrolling:touch;}
.rm-panel{display:none;flex-direction:column;gap:14px;}
.rm-panel.on{display:flex;}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--fg4);}

/* Aircraft */
.ac-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.ac-card{border-radius:var(--r);border:2px solid transparent;padding:20px 8px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;touch-action:manipulation;transition:transform .12s,box-shadow .15s;}
.ac-card:active{transform:scale(.9);}
.ac-card.sel{box-shadow:0 0 0 2.5px #fff,0 0 0 5px rgba(255,255,255,.18);}
.ac-big{font-size:40px;font-weight:900;line-height:1;}
.ac-nm{font-size:11px;font-weight:600;color:rgba(255,255,255,.65);}
.ac-pl{font-size:9px;color:rgba(255,255,255,.38);text-align:center;line-height:1.4;}

/* Company pick */
.co-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.co-pc{border-radius:var(--r);border:2px solid var(--ln2);background:var(--ink2);overflow:hidden;cursor:pointer;touch-action:manipulation;transition:transform .12s,border-color .15s;display:flex;flex-direction:column;}
.co-pc:active{transform:scale(.93);}
.co-pc.sel{border-color:var(--blue);}
.co-pc-img{width:100%;height:100px;background:var(--ink3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;}
.co-pc-img img{width:100%;height:100%;object-fit:cover;}
.co-pc-name{padding:10px;font-size:13px;font-weight:700;text-align:center;color:var(--fg2);border-top:1px solid var(--ln);background:var(--ink2);}

/* Lots */
.lot-g{background:var(--ink2);border-radius:var(--r);border:1px solid var(--ln);overflow:hidden;margin-bottom:10px;}
.lot-g-h{padding:10px 16px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--fg4);border-bottom:1px solid var(--ln);}
.lot-chips{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;}
.lchip{padding:10px 15px;border-radius:var(--rp);border:1.5px solid var(--ln2);background:var(--ink3);color:var(--fg2);font-size:14px;font-weight:700;cursor:pointer;touch-action:manipulation;transition:all .12s;}
.lchip:active{transform:scale(.87);}
.lchip.sel{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 14px rgba(10,132,255,.4);}
.lchip.blk{opacity:.1;pointer-events:none;}

/* Route footer */
.rm-foot{flex-shrink:0;padding:12px 16px max(env(safe-area-inset-bottom),16px);display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;border-top:1px solid var(--ln);background:#000;}

/* Toast */
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 80px);left:50%;transform:translateX(-50%) translateY(10px);padding:12px 24px;border-radius:var(--rp);font-size:14px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.34,1.56,.64,1);z-index:999;background:var(--ink3);color:var(--fg);border:1px solid var(--ln2);box-shadow:0 8px 32px rgba(0,0,0,.8);}
.toast.ok{background:var(--green2);border-color:transparent;}
.toast.er{background:var(--red);border-color:transparent;}
.toast.info{background:#5e5ce6;border-color:transparent;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup">
  <div class="setup-mark">✈</div>
  <div class="setup-h">FTS <span>Arrival</span></div>
  <div class="setup-p">Connect your Google Sheet to start recording ground process times.</div>
  <div class="field-lbl">Apps Script URL</div>
  <input class="field-inp" id="urlInp" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="cta" id="connBtn" onclick="doConn()">Connect &amp; Load</button>
  <div class="err" id="connErr"></div>
</div>

<!-- APP -->
<div id="app">

<script>
// ── Config ──
var KU='fts_u',KQ='fts_q',KS='fts_s',KCO='fts_co';
var NS=12,NC=12;
var ACS=[
  {c:'B', bg:'#1e3a8a',cl:'#93c5fd',lb:'Code B', pl:'LJ45, ATR42, Yak40',mx:'B'},
  {c:'C', bg:'#14532d',cl:'#86efac',lb:'Code C', pl:'A320, B737, A220',  mx:'C'},
  {c:'C+',bg:'#365314',cl:'#bef264',lb:'Code C+',pl:'B737MAX, A321',     mx:'C'},
  {c:'D', bg:'#7c2d12',cl:'#fdba74',lb:'Code D', pl:'B767, B757, C130',  mx:'D'},
  {c:'E', bg:'#3b0764',cl:'#d8b4fe',lb:'Code E', pl:'B777, A330, A340',  mx:'E'},
  {c:'F', bg:'#450a0a',cl:'#fca5a5',lb:'Code F', pl:'B747, A380, An-124',mx:'F'},
];
var LGS=[
  {g:'Section 1',ids:['1R','1','2R','2','2L','3R','3','4R','4','4L']},
  {g:'Section 2',ids:['5R','5','6R','6','6L','7','7L','7A','8R','8','8A','8L','18','18L']},
  {g:'Section 3',ids:['19','20','21','22','23']},
  {g:'Section 4',ids:['9','9L','10R','10','11R','11','11L','12R','12']},
  {g:'Section 5',ids:['13','14','15']},
  {g:'Section 6',ids:['16R','16','16L','17','17L']},
];
var LM={'1':'E','2':'E','3':'D','4':'D','5':'D','6':'D','7':'D','8':'D','7A':'C','8A':'C','18':'C','18L':'C','9':'C','10':'C','11':'C','12':'C','13':'C','14':'C','15':'C','16':'C','17':'C'};
var CD=['B','C','D','E','F'];
function ci(c){return CD.indexOf((c||'B').replace('+',''));}

// ── Storage ──
function mS(){return{name:'',img:null,visible:true};}
function mC(){return{name:'',img:null};}
function la(k,n,mk){try{var r=JSON.parse(localStorage.getItem(k));if(!Array.isArray(r))throw 0;return Array.from({length:n},function(_,i){return Object.assign(mk(),r[i]||{});});}catch{return Array.from({length:n},mk);}}
function sa(k,a){localStorage.setItem(k,JSON.stringify(a));}
var SL=la(KS,NS,mS),CO=la(KCO,NC,mC);

// ── Session ──
function ns(){return{run:false,splits:[],t0:null,lt:null,iv:null,iso:null,tn:0,ut:null,lot:null,ac:null,co:null};}
var S=ns();

// ── Queue ──
function qg(){try{return JSON.parse(localStorage.getItem(KQ)||'[]');}catch{return[];}}
function qs(q){localStorage.setItem(KQ,JSON.stringify(q));}
function qpush(s){var q=qg();q.push(s);qs(q);qUI();}
function qUI(){
  var n=qg().length;
  var c=document.getElementById('sCnt');if(c){c.textContent=n;c.className='scnt'+(n?' on':'');}
  var b=document.getElementById('bSync');if(b)b.className='circ'+(n?' hq':'');
  var qb=document.getElementById('qb');if(!qb)return;
  if(n){qb.classList.add('on');var t=document.getElementById('qbTxt');if(t)t.textContent=n+' offline';}
  else qb.classList.remove('on');
}

// ── JSONP ──
var URL_='';
function jsonp(url,p,ms){
  ms=ms||10000;
  return new Promise(function(res,rej){
    var id='_cb'+Date.now()+'_'+Math.floor(Math.random()*99999);
    var el=document.createElement('script'),done=false;
    var t=setTimeout(function(){if(done)return;done=true;cl();rej(new Error('Timed out'));},ms);
    function cl(){clearTimeout(t);if(el.parentNode)el.parentNode.removeChild(el);try{delete window[id];}catch(e){window[id]=undefined;}}
    window[id]=function(d){if(done)return;done=true;cl();res(d);};
    var q='';Object.keys(p).forEach(function(k){q+=(q?'&':'')+k+'='+encodeURIComponent(p[k]);});
    el.src=url+'?'+q+'&callback='+id;
    el.onerror=function(){if(done)return;done=true;cl();rej(new Error('Script load failed'));};
    document.head.appendChild(el);
  });
}
function np(b){return jsonp(URL_,{action:'saveData',payload:JSON.stringify(b)},12000);}

// ── Connect ──
function doConn(){
  var raw=(document.getElementById('urlInp').value||'').trim();
  var err=document.getElementById('connErr'),btn=document.getElementById('connBtn');
  err.classList.remove('on');
  if(!raw){err.textContent='Please paste your Apps Script URL.';err.classList.add('on');return;}
  if(raw.indexOf('script.google.com')===-1){err.textContent="Doesn't look like an Apps Script URL.";err.classList.add('on');return;}
  var url=raw.replace(/[\/\s]+$/,'').replace(/\/(exec|dev)$/,'')+'/exec';
  btn.textContent='Connecting…';btn.disabled=true;
  jsonp(url,{action:'headers'},12000)
    .then(function(d){
      if(d.error)throw new Error(d.error);
      if(!d.actions||!d.actions.length)throw new Error('No actions found in sheet');
      localStorage.setItem(KU,url);URL_=url;
      fillSl(d.actions);showApp();
    })
    .catch(function(e){
      err.textContent='Failed: '+(e.message||'unknown');err.classList.add('on');
      btn.textContent='Connect & Load';btn.disabled=false;
    });
}
function fillSl(a){a.forEach(function(x,i){if(i<NS&&!SL[i].name)SL[i].name=x.name;});sa(KS,SL);}
function showApp(){document.getElementById('setup').style.display='none';document.getElementById('app').classList.add('on');buildGrid();}

// ── Sync ──
var syncing=false;
function doSync(){
  if(syncing){toast('Already syncing…','info');return;}
  var q=qg();if(!q.length){toast('Nothing to sync','info');return;}
  syncing=true;document.getElementById('bSync').disabled=true;
  toast('Syncing '+q.length+'…','info');
  var i=0,ok=0,fail=[];
  function nx(){
    if(i>=q.length){qs(fail);qUI();syncing=false;document.getElementById('bSync').disabled=false;
      if(!fail.length)toast('✓ All '+ok+' synced!','ok');else toast(ok+' synced, '+fail.length+' failed','er');return;}
    np(q[i++]).then(function(d){if(d&&d.error)throw 0;ok++;nx();}).catch(function(){fail.push(q[i-1]);nx();});
  }nx();
}
window.addEventListener('online',function(){if(qg().length)setTimeout(doSync,2000);});

// ── Wake lock + orientation ──
var _wl=null;
function wakeOn(){if('wakeLock' in navigator)navigator.wakeLock.request('screen').then(function(w){_wl=w;}).catch(function(){});}
function wakeOff(){if(_wl){_wl.release();_wl=null;}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&S.run)wakeOn();});

// ── Boot ──
window.addEventListener('load',function(){
  qUI();SL=la(KS,NS,mS);CO=la(KCO,NC,mC);
  URL_=localStorage.getItem(KU)||'';
  try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(function(){});}catch(e){}
  if(URL_){showApp();jsonp(URL_,{action:'headers'},8000).then(function(d){if(!d.error&&d.actions){fillSl(d.actions);buildGrid();}}).catch(function(){});}
  document.getElementById('iPick').addEventListener('change',function(){
    if(!this.files||!this.files[0]||_ci<0)return;
    var f=this.files[0];this.value='';
    var r=new FileReader();r.onload=function(e){openCrop(e.target.result);};r.readAsDataURL(f);
  });
});

// ── Grid ──
var eMode=false;
function buildGrid(){
  var vis=SL.map(function(s,i){return{s:s,i:i};}).filter(function(x){return x.s.visible;});
  var rows=Math.max(1,Math.ceil(vis.length/2));
  var g=document.getElementById('grid');g.innerHTML='';g.style.gridTemplateRows='repeat('+rows+',1fr)';
  vis.forEach(function(x){
    var i=x.i,sl=x.s,em=!sl.name;
    var b=document.createElement('button');
    b.className='sp'+(em?' em':'')+(eMode?' eon':'');
    b.id='ab'+i;b.disabled=(!S.run&&!eMode)||em;
    var ih=sl.img?'<img class="sp-bg" src="'+sl.img+'" alt=""><div class="sp-scrim"></div>':'';
    b.innerHTML=ih+'<span class="sp-etag">EDIT</span><span class="sp-name">'+(sl.name||'—')+'</span><span class="sp-time" id="at'+i+'"></span>';
    b.addEventListener('click',function(){if(eMode)focSl(i);else tap(i);});
    g.appendChild(b);
  });
}

// ── Timer ──
function mainClick(){S.run?stopT():startT();}
function startT(){
  if(S.run||eMode)return;
  clearTimeout(S.ut);hideF();S=ns();S.run=true;S.t0=S.lt=performance.now();S.iso=new Date().toISOString();
  S.iv=setInterval(function(){document.getElementById('tmr').textContent=fmt(performance.now()-S.t0);},41);
  document.getElementById('tmr').className='run';setBadge('run');
  var m=document.getElementById('btnM');m.textContent='■ Stop';m.classList.add('stp');
  document.getElementById('bGear').disabled=true;wakeOn();
  SL.forEach(function(_,i){
    var b=document.getElementById('ab'+i);if(!b)return;
    b.disabled=!SL[i].name;b.className='sp'+(SL[i].name?'':' em');
    var t=document.getElementById('at'+i);if(t)t.textContent='';
    var n=b.querySelector('.sp-n');if(n)n.remove();
  });
}
function stopT(){
  if(!S.run)return;
  S.run=false;clearInterval(S.iv);S.iv=null;wakeOff();
  document.getElementById('tmr').className='stp';setBadge('stp');
  var m=document.getElementById('btnM');m.textContent='▶ Start';m.classList.remove('stp');
  document.getElementById('bGear').disabled=false;
  SL.forEach(function(_,i){var b=document.getElementById('ab'+i);if(b)b.disabled=true;});
  if(S.splits.length>0){
    var f=document.getElementById('btnF');
    f.textContent='✈ Finish Route';f.classList.add('on');f.classList.remove('go');
    f.style.pointerEvents='none';f.style.opacity='0.4';
    S.ut=setTimeout(function(){f.classList.add('go');f.style.pointerEvents='';f.style.opacity='';},400);
  }
}
function hideF(){var f=document.getElementById('btnF');f.classList.remove('on','go');f.style.pointerEvents='none';f.style.opacity='0.4';}
function tap(i){
  if(!S.run||!SL[i]||!SL[i].name)return;
  var now=performance.now(),total=now-S.t0;S.lt=now;S.tn++;
  var name=SL[i].name;
  S.splits=S.splits.filter(function(s){return s.actionName!==name;});
  S.splits.push({actionName:name,deltaMs:total});
  var b=document.getElementById('ab'+i);b.className='sp hit';
  var t=document.getElementById('at'+i);if(t)t.textContent=fmt(total);
  var num=b.querySelector('.sp-n');
  if(!num){num=document.createElement('span');num.className='sp-n';b.appendChild(num);}
  num.textContent='#'+S.tn;
}

// ── Settings ──
var _tab='s',_ci=-1,_ct='s';
function openSet(){
  if(S.run)return;eMode=true;
  document.getElementById('bGear').classList.add('on');

  document.getElementById('setOv').classList.add('on');

function closeSet(){
  eMode=false;document.getElementById('bGear').classList.remove('on');

}
function setOvCl(e){if(e.target===document.getElementById('setOv'))closeSet();}
function swTab(t){
  _tab=t;
  document.getElementById('tabS').className='seg-btn'+(t==='s'?' on':'');
  document.getElementById('tabC').className='seg-btn'+(t==='c'?' on':'');
  buildSetList();

}
function buildSetList(){
  var list=document.getElementById('setList');list.innerHTML='';
  if(_tab==='s'){
    SL.forEach(function(sl,i){
      var card=document.createElement('div');card.className='sl-card';card.id='sc'+i;
      var thumb=document.createElement('div');thumb.className='sl-thumb';
      (function(idx){thumb.addEventListener('click',function(){_ci=idx;_ct='s';document.getElementById('iPick').click();});})(i);
      var im=document.createElement('img');if(sl.img){im.src=sl.img;im.classList.add('vis');}
      thumb.appendChild(im);if(!sl.img)thumb.innerHTML+='📷';
      var body=document.createElement('div');body.className='sl-body';
      var lbl=document.createElement('div');lbl.className='sl-lbl';lbl.textContent='Slot '+(i+1);
      var inp=document.createElement('input');inp.className='sl-inp';inp.type='text';inp.placeholder='Action name…';inp.value=sl.name||'';inp.setAttribute('inputmode','text');
      (function(idx){inp.addEventListener('input',function(){SL[idx].name=this.value.trim();});})(i);
      var vr=document.createElement('div');vr.className='sl-vis-row';
      var vl=document.createElement('span');vl.className='sl-vis-lbl';vl.textContent='Show button';
      var tw=document.createElement('label');tw.className='tog';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=sl.visible;
      var tr=document.createElement('span');tr.className='tog-tr';
      (function(idx,c){c.addEventListener('change',function(){SL[idx].visible=c.checked;});})(i,cb);
      tw.appendChild(cb);tw.appendChild(tr);vr.appendChild(vl);vr.appendChild(tw);
      body.appendChild(lbl);body.appendChild(inp);body.appendChild(vr);
      card.appendChild(thumb);card.appendChild(body);list.appendChild(card);
    });
  } else {
    CO.forEach(function(co,i){
      if(!co.name&&!co.img)return;
      var card=document.createElement('div');card.className='co-card';card.id='cc'+i;
      var logo=document.createElement('div');logo.className='co-logo';
      (function(idx){logo.addEventListener('click',function(){_ci=idx;_ct='c';document.getElementById('iPick').click();});})(i);
      if(co.img){var im=document.createElement('img');im.src=co.img;logo.appendChild(im);}
      else logo.textContent='🏢';
      var body=document.createElement('div');body.className='co-body';
      var lbl=document.createElement('div');lbl.className='sl-lbl';lbl.textContent='Company '+(i+1);
      var inp=document.createElement('input');inp.className='sl-inp';inp.type='text';inp.placeholder='Company name…';inp.value=co.name||'';inp.setAttribute('inputmode','text');
      (function(idx){inp.addEventListener('input',function(){CO[idx].name=this.value.trim();});})(i);
      body.appendChild(lbl);body.appendChild(inp);
      var del=document.createElement('button');del.className='co-del';del.textContent='×';
      (function(idx){del.addEventListener('click',function(){CO[idx]={name:'',img:null};sa(KCO,CO);buildSetList();});})(i);
      card.appendChild(logo);card.appendChild(body);card.appendChild(del);list.appendChild(card);
    });
    var add=document.createElement('button');add.className='co-add';add.innerHTML='<span style="font-size:22px">+</span> Add Company';
    add.addEventListener('click',function(){
      var ei=CO.findIndex(function(c){return!c.name&&!c.img;});
      if(ei===-1){toast('Max companies reached','info');return;}
      CO[ei]={name:'New Company',img:null};sa(KCO,CO);buildSetList();
    });
    list.appendChild(add);
  }
}
function saveSets(){
  var btn=document.getElementById('setSave');btn.disabled=true;btn.textContent='Saving…';
  sa(KS,SL);sa(KCO,CO);
  if(_tab==='s'&&URL_&&navigator.onLine){
    jsonp(URL_,{action:'updateHeaders',slots_json:JSON.stringify(SL.map(function(s){return s.name||'';}))},10000)
      .then(function(){toast('✓ Saved to sheet','ok');}).catch(function(){toast('Saved locally','info');});
    setTimeout(function(){btn.disabled=false;btn.textContent='Save';closeSet();},900);
  } else {
    toast(_tab==='c'?'Companies saved':'Saved locally','ok');
    btn.disabled=false;btn.textContent=_tab==='c'?'Save Companies':'Save';closeSet();

function focSl(i){var el=document.getElementById('sc'+i);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});var inp=el.querySelector('.sl-inp');if(inp)setTimeout(function(){inp.focus();},280);}}

// ── Crop ──
var _cImg=null,_cX=0,_cY=0,_cZ=1,_cDrag=null,_cPinch=null;
// Returns canvas dimensions based on target type
// Slot buttons: 3:2 landscape (fits wide card thumb)
// Companies: 16:9 (fits wide logo card)
function cropDims(){
  if(_ct==='c') return {w:280, h:157, ow:320, oh:180};  // 16:9 for company logos
  return {w:280, h:175, ow:320, oh:200};                 // 8:5 for split button thumbs
}
// Crop dimensions by target type
// 'c' = company (settings logo) : 280x180
// 's' = split button slot thumb : 280x180 (buttons are landscape rectangles)
// default fallback: 280x180
function cropDims(){
  // All targets are landscape rectangles - split buttons fill wide cells, company logos are wide
  return {w:280, h:180, ow:400, oh:256};
}
function openCrop(src){
  _cX=0;_cY=0;_cZ=1;
  document.getElementById('cZoom').value=1;
  var d=cropDims();
  var cv=document.getElementById('cCv');
  var frame=document.getElementById('cropFrame');
  cv.width=d.w; cv.height=d.h;
  frame.style.width=d.w+'px'; frame.style.height=d.h+'px';
  var img=new Image();
  img.onload=function(){
    _cImg=img;
    // Auto-fit: scale image to fill the crop area initially
    var scaleX=d.w/img.width, scaleY=d.h/img.height;
    _cZ=Math.max(scaleX,scaleY)*1.0;
    document.getElementById('cZoom').value=Math.min(_cZ,4);
    drawCrop();
    document.getElementById('cropMod').classList.add('on');
  };
  img.src=src;
}
function drawCrop(){
  var cv=document.getElementById('cCv'),ctx=cv.getContext('2d');
  var W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  var z=_cZ,iw=_cImg.width*z,ih=_cImg.height*z;
  ctx.drawImage(_cImg,W/2+_cX-iw/2,H/2+_cY-ih/2,iw,ih);
}
document.getElementById('cZoom').addEventListener('input',function(){_cZ=parseFloat(this.value);drawCrop();});
var cv=document.getElementById('cCv');
cv.addEventListener('mousedown',function(e){_cDrag={x:e.clientX,y:e.clientY};});
document.addEventListener('mousemove',function(e){if(!_cDrag)return;_cX+=e.clientX-_cDrag.x;_cY+=e.clientY-_cDrag.y;_cDrag={x:e.clientX,y:e.clientY};drawCrop();});
document.addEventListener('mouseup',function(){_cDrag=null;});
cv.addEventListener('touchstart',function(e){
  if(e.touches.length===1)_cDrag={x:e.touches[0].clientX,y:e.touches[0].clientY};
  else if(e.touches.length===2)_cPinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',function(e){
  if(e.touches.length===1&&_cDrag){_cX+=e.touches[0].clientX-_cDrag.x;_cY+=e.touches[0].clientY-_cDrag.y;_cDrag={x:e.touches[0].clientX,y:e.touches[0].clientY};drawCrop();}
  else if(e.touches.length===2&&_cPinch){var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);_cZ=Math.max(0.5,Math.min(4,_cZ*(d/_cPinch)));_cPinch=d;document.getElementById('cZoom').value=_cZ;drawCrop();}
  e.preventDefault();},{passive:false});
cv.addEventListener('touchend',function(){_cDrag=null;_cPinch=null;});
function cropCancel(){document.getElementById('cropMod').classList.remove('on');_ci=-1;}
function cropOK(){
  var srcCv=document.getElementById('cCv');
  var d=cropDims();
  var out=document.createElement('canvas');
  out.width=d.ow; out.height=d.oh;
  var ctx2=out.getContext('2d');
  ctx2.drawImage(srcCv,0,0,srcCv.width,srcCv.height,0,0,d.ow,d.oh);
  var b64=out.toDataURL('image/jpeg',0.88);
  document.getElementById('cropMod').classList.remove('on');
  if(_ct==='c'){CO[_ci].img=b64;sa(KCO,CO);buildSetList();}
  else{SL[_ci].img=b64;sa(KS,SL);buildGrid();
    var el=document.getElementById('sc'+_ci);
    if(el){var t=el.querySelector('.sl-thumb');if(t){t.innerHTML='';var im2=document.createElement('img');im2.src=b64;im2.classList.add('vis');t.appendChild(im2);}}
  }
  _ci=-1;
}

// ── Route ──
var rStep=1;
function openRoute(){
  if(!S.splits.length)return;
  S.ac=null;S.co=null;S.lot=null;rStep=1;
  buildAcGrid();showStep(1);
  var bs=document.getElementById('btnSend');
  bs.removeAttribute('data-saving');bs.style.display='none';bs.style.opacity='0.35';bs.style.pointerEvents='none';
  var bn=document.getElementById('btnNext');bn.style.display='';bn.style.opacity='0.35';bn.style.pointerEvents='none';
  document.getElementById('routeMod').classList.add('on');
}
function closeRoute(){document.getElementById('routeMod').classList.remove('on');}
function showStep(n){
  rStep=n;
  [1,2,3].forEach(function(i){document.getElementById('rp'+i).classList.toggle('on',i===n);});
  var isLast=n===3;
  var bn=document.getElementById('btnNext'),bs=document.getElementById('btnSend');
  bn.style.display=isLast?'none':'';bs.style.display=isLast?'':'none';
  updSteps();
}
function updSteps(){
  [1,2,3].forEach(function(i){
    var el=document.getElementById('st'+i);if(!el)return;
    if(i<rStep)el.className='stab done';else if(i===rStep)el.className='stab on';else el.className='stab';
  });
  document.getElementById('sv1').textContent=S.ac?S.ac.c:'';
  document.getElementById('sv2').textContent=S.co||'';
  document.getElementById('sv3').textContent=S.lot||'';
}
function goStep(n){
  if(n===rStep)return;
  if(n<rStep){showStep(n);return;}
  if(n===2&&S.ac){buildCoPick();showStep(2);}
  else if(n===3&&S.ac){buildLots();showStep(3);updSave();}
}
function rNext(){if(rStep===1){if(!S.ac)return;buildCoPick();showStep(2);}else if(rStep===2){buildLots();showStep(3);updSave();}}
function rBack(){if(rStep===1)closeRoute();else showStep(rStep-1);}

function buildAcGrid(){
  var el=document.getElementById('acGrid');el.innerHTML='';
  ACS.forEach(function(ac){
    var b=document.createElement('button');b.className='ac-card';b.style.background=ac.bg;
    b.innerHTML='<div class="ac-big" style="color:'+ac.cl+'">'+ac.c+'</div><div class="ac-nm">'+ac.lb+'</div><div class="ac-pl">'+ac.pl+'</div>';
    b.addEventListener('click',function(){
      document.querySelectorAll('.ac-card').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');S.ac=ac;
      var bn=document.getElementById('btnNext');bn.style.opacity='1';bn.style.pointerEvents='auto';
      updSteps();
    });
    el.appendChild(b);
  });
}
function buildCoPick(){
  var el=document.getElementById('coPick');el.innerHTML='';
  CO.forEach(function(co){
    if(!co.name)return;
    var b=document.createElement('button');b.className='co-pc';
    var ih=co.img?'<img src="'+co.img+'">':'<span style="font-size:30px">🏢</span>';
    b.innerHTML='<div class="co-pc-img">'+ih+'</div><div class="co-pc-name">'+co.name+'</div>';
    b.addEventListener('click',function(){
      document.querySelectorAll('.co-pc').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');S.co=co.name;updSteps();
      setTimeout(function(){buildLots();showStep(3);updSave();},230);
    });
    el.appendChild(b);
  });
  var unk=document.createElement('button');unk.className='co-pc';
  unk.innerHTML='<div class="co-pc-img"><span style="font-size:30px">🚫</span></div><div class="co-pc-name">Unknown</div>';
  unk.addEventListener('click',function(){S.co='Unknown';buildLots();showStep(3);updSave();});
  el.appendChild(unk);
  var bn=document.getElementById('btnNext');bn.style.opacity='1';bn.style.pointerEvents='auto';
}
function buildLots(){
  var el=document.getElementById('lotGs');el.innerHTML='';
  var si=ci(S.ac?S.ac.mx:'B');
  LGS.forEach(function(grp){
    var w=document.createElement('div');w.className='lot-g';
    var h=document.createElement('div');h.className='lot-g-h';h.textContent=grp.g;w.appendChild(h);
    var c=document.createElement('div');c.className='lot-chips';
    grp.ids.forEach(function(id){
      var mc=LM[id]||'B',blk=si<ci(mc);
      var chip=document.createElement('button');chip.className='lchip'+(blk?' blk':'');chip.dataset.v=id;chip.textContent=id;
      if(!blk)chip.addEventListener('click',function(){
        var v=chip.dataset.v;
        if(S.lot===v){S.lot=null;document.querySelectorAll('.lchip').forEach(function(x){x.classList.remove('sel');});}
        else{S.lot=v;document.querySelectorAll('.lchip:not(.blk)').forEach(function(x){x.classList.toggle('sel',x.dataset.v===v);});}
        updSteps();updSave();
      });
      c.appendChild(chip);
    });
    w.appendChild(c);el.appendChild(w);
  });
}
function updSave(){
  var bs=document.getElementById('btnSend');
  if(S.lot&&S.ac){bs.removeAttribute('data-saving');bs.style.opacity='1';bs.style.pointerEvents='auto';}
  else{bs.style.opacity='0.35';bs.style.pointerEvents='none';}
}
function doSave(){
  var bs=document.getElementById('btnSend');
  if(bs.hasAttribute('data-saving'))return;
  bs.setAttribute('data-saving','1');bs.style.opacity='0.5';bs.style.pointerEvents='none';bs.textContent='Saving…';
  var sess={startTimeISO:S.iso,splits:S.splits.slice(),parkLot:S.lot,planeSize:S.ac?S.ac.c:'',company:S.co||''};
  np(sess).then(function(d){
    if(d&&d.error)throw new Error(d.error);
    toast('✓ Saved — Row '+d.row,'ok');closeRoute();setTimeout(reset,1200);
  }).catch(function(){
    qpush(sess);toast('Offline — queued ('+qg().length+')','info');closeRoute();setTimeout(reset,1500);
  });
}

// ── Reset ──
function reset(){
  clearTimeout(S.ut);clearInterval(S.iv);S=ns();
  document.getElementById('tmr').textContent='0:00.000';document.getElementById('tmr').className='';
  var m=document.getElementById('btnM');m.textContent='▶ Start';m.classList.remove('stp');
  document.getElementById('bGear').disabled=false;
  hideF();setBadge('');qUI();buildGrid();
}

// ── Helpers ──
function fmt(ms){var t=Math.round(ms);return Math.floor(t/60000)+':'+String(Math.floor((t%60000)/1000)).padStart(2,'0')+'.'+String(t%1000).padStart(3,'0');}
function setBadge(type){
  document.getElementById('badge').className='badge'+(type?' '+type:'');
  document.getElementById('bdot').className='dot'+(type==='run'?' live':type==='stp'?' dead':'');
  document.getElementById('bTxt').textContent=type==='run'?'Running':type==='stp'?'Stopped':'Ready';
}
function toast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type+' on';setTimeout(function(){t.className='toast '+type;},3200);}
