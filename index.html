<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FTS Arrival">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json">
<title>FTS Arrival</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg:#0a0a0f; --bg2:#141418; --bg3:#1e1e24;
  --border:rgba(255,255,255,0.08); --border2:rgba(255,255,255,0.05);
  --accent:#3b82f6; --accent2:#60a5fa;
  --green:#22c55e; --red:#ef4444;
  --gold:#f59e0b; --purple:#a855f7;
  --white:#fff; --off:#e2e8f0;
  --muted:rgba(226,232,240,0.4); --muted2:rgba(226,232,240,0.15);
  --taxi:#f97316;
}

*,*::before,*::after {
  box-sizing:border-box; margin:0; padding:0;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  font-family:'Inter',-apple-system,sans-serif;
}

html { height:100%; background:var(--bg); }

body {
  width:100%; height:100dvh;
  overflow:hidden; position:fixed; inset:0;
  background:var(--bg); color:var(--white);
  display:flex; flex-direction:column;
}

/* ══ SETUP ══ */
#setup {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:32px 24px; gap:0;
}
.s-icon { font-size:48px; margin-bottom:14px; }
.s-title { font-size:24px; font-weight:800; letter-spacing:-0.5px; margin-bottom:8px; }
.s-title span { color:var(--accent2); }
.s-desc { font-size:13px; color:var(--muted); text-align:center; line-height:1.6; margin-bottom:24px; max-width:280px; }
.s-lbl { width:100%; font-size:11px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
.s-inp {
  width:100%; padding:13px 14px;
  background:var(--bg3); border:1px solid var(--border); border-radius:12px;
  color:var(--white); font-size:14px; font-weight:500;
  margin-bottom:12px; outline:none; transition:border-color 0.2s;
  -webkit-user-select:text; user-select:text;
}
.s-inp:focus { border-color:var(--accent); }
.s-inp::placeholder { color:var(--muted2); }
.s-btn {
  width:100%; padding:16px; border-radius:14px; border:none;
  background:var(--accent); color:#fff; font-size:16px; font-weight:700;
  cursor:pointer; touch-action:manipulation; transition:opacity 0.15s;
}
.s-btn:active { opacity:0.8; }
.s-btn:disabled { opacity:0.5; cursor:not-allowed; }
.s-err { margin-top:10px; font-size:13px; color:var(--red); text-align:center; display:none; line-height:1.5; }
.s-err.show { display:block; }

/* ══ APP ══ */
#app { display:none; flex-direction:column; height:100%; overflow:hidden; }
#app.show { display:flex; }

/* ── Topbar ── */
.topbar {
  flex-shrink:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:max(env(safe-area-inset-top),12px) 14px 8px;
  border-bottom:1px solid var(--border); background:var(--bg); gap:10px;
}
.timer-block { display:flex; flex-direction:column; }
.t-lbl { font-size:8px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); }
#timer {
  font-size:28px; font-weight:800; letter-spacing:-0.5px;
  font-variant-numeric:tabular-nums; color:var(--off); line-height:1.1; transition:color 0.2s;
}
#timer.run { color:var(--green); }
#timer.stp { color:var(--red); }
.topbar-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }
.spill {
  display:flex; align-items:center; gap:5px; padding:4px 10px;
  border-radius:50px; background:var(--bg3); border:1px solid var(--border);
  font-size:10px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase;
  color:var(--muted); transition:all 0.25s; white-space:nowrap;
}
.spill.run { background:rgba(34,197,94,0.12); border-color:rgba(34,197,94,0.3); color:var(--green); }
.spill.stp { background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.3); color:var(--red); }
.sdot { width:5px; height:5px; border-radius:50%; background:var(--muted2); transition:background 0.25s; }
.sdot.live { background:var(--green); animation:blink 1.1s infinite; }
.sdot.dead { background:var(--red); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
#qBadge {
  display:none; align-items:center; gap:4px; padding:4px 8px;
  border-radius:50px; background:rgba(168,85,247,0.15); border:1px solid rgba(168,85,247,0.35);
  font-size:10px; font-weight:700; color:var(--purple); cursor:pointer; white-space:nowrap;
  touch-action:manipulation;
}
#qBadge.show { display:flex; }
.qbdot { width:5px; height:5px; border-radius:50%; background:var(--purple); animation:blink 1.4s infinite; }

/* ── Grid ── */
.grid-wrap { flex:1 1 0; min-height:0; padding:7px 9px 5px; }
#grid {
  width:100%; height:100%;
  display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:7px;
}
.act {
  border-radius:16px; border:1px solid var(--border); background:var(--bg2);
  color:var(--white); font-size:clamp(13px,4vw,16px); font-weight:700; letter-spacing:-0.2px;
  cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; padding:8px 6px; text-align:center; line-height:1.25;
  position:relative; overflow:hidden;
  transition:transform 0.1s, border-color 0.15s;
  width:100%; height:100%; touch-action:manipulation;
}
.act-img {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center; border-radius:16px; z-index:0;
}
.act-overlay {
  position:absolute; inset:0;
  background:linear-gradient(160deg,rgba(0,0,0,0.6),rgba(0,0,0,0.4));
  border-radius:16px; z-index:1; pointer-events:none;
}
.act-name, .act-split, .act-num, .act-elbl {
  position:relative; z-index:2;
  text-shadow:0 1px 5px rgba(0,0,0,0.95);
}
.act-name { font-size:clamp(12px,3.8vw,15px); font-weight:800; line-height:1.2; }
.act-split { font-size:11px; font-weight:700; color:var(--green); font-variant-numeric:tabular-nums; }
.act-num { position:absolute; top:6px; right:8px; font-size:9px; font-weight:700; color:var(--gold); z-index:3; }
.act-elbl { position:absolute; top:6px; left:8px; font-size:9px; font-weight:700; color:var(--accent2); display:none; z-index:3; }
.act:disabled { opacity:0.13; cursor:not-allowed; }
.act:not(:disabled):not(.done):active { transform:scale(0.90); }
.act.done { border-color:rgba(34,197,94,0.5); pointer-events:none; }
.act.done::after { content:''; position:absolute; inset:0; background:rgba(34,197,94,0.15); z-index:2; border-radius:16px; pointer-events:none; }
.act.empty { opacity:0.18; pointer-events:none; }
.act.emode { border-color:rgba(59,130,246,0.5); background:rgba(59,130,246,0.08); cursor:pointer; pointer-events:auto; opacity:1; }
.act.emode .act-elbl { display:block; }
.act.emode:active { transform:scale(0.93); }

/* ── Bottom bar ── */
.btm { flex-shrink:0; padding:7px 9px max(env(safe-area-inset-bottom),10px); background:var(--bg); border-top:1px solid var(--border); }
#btnFinish {
  display:none; width:100%; padding:14px; margin-bottom:7px;
  border-radius:14px; border:none;
  background:linear-gradient(135deg,#f97316,#ea580c);
  color:#fff; font-size:15px; font-weight:700;
  cursor:pointer; touch-action:manipulation;
  opacity:0.4; pointer-events:none; transition:opacity 0.2s;
}
#btnFinish.show { display:block; }
#btnFinish.ready { opacity:1; pointer-events:auto; }
#btnFinish:active { opacity:0.8; }

.ctrl { display:grid; grid-template-columns:auto 1fr auto; gap:7px; }
#btnMain {
  height:52px; border-radius:14px; border:none;
  font-size:16px; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:var(--green); color:#fff; touch-action:manipulation; transition:all 0.15s;
  box-shadow:0 4px 16px rgba(34,197,94,0.25);
}
#btnMain.stp { background:var(--bg3); color:var(--red); border:1px solid rgba(239,68,68,0.25); box-shadow:none; }
#btnMain:active { transform:scale(0.94); }
#btnSync, #btnSettings {
  width:52px; height:52px; border-radius:14px; border:none;
  cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:2px;
  transition:all 0.15s; touch-action:manipulation;
}
#btnSync { background:var(--bg3); border:1px solid rgba(168,85,247,0.25); }
#btnSync.has-q { border-color:rgba(168,85,247,0.5); background:rgba(168,85,247,0.1); animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(168,85,247,0)} 50%{box-shadow:0 0 0 5px rgba(168,85,247,0.15)} }
#btnSync:active, #btnSettings:active { transform:scale(0.93); }
#btnSettings { background:var(--bg3); border:1px solid rgba(96,165,250,0.2); }
#btnSettings.on { background:rgba(59,130,246,0.15); border-color:rgba(59,130,246,0.5); }
#btnSettings:disabled { opacity:0.2; cursor:not-allowed; }
.s-cnt { font-size:10px; font-weight:800; color:var(--purple); line-height:1; display:none; }
.s-cnt.show { display:block; }
.s-ico { width:22px; height:22px; object-fit:contain; }
.s-ico-sync { filter:brightness(0) invert(1); opacity:0.75; }
.s-ico-gear { filter:brightness(0) invert(1); opacity:0.75; }
#btnSettings.on .s-ico-gear { filter:brightness(0) saturate(100%) invert(60%) sepia(100%) saturate(300%) hue-rotate(180deg); opacity:1; }

/* ══ SETTINGS SHEET ══ */
#settingsOverlay {
  position:fixed; inset:0; z-index:80;
  background:rgba(0,0,0,0.7);
  display:none; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(4px);
}
#settingsOverlay.show { display:flex; }
.settings-sheet {
  width:100%; max-width:480px;
  background:var(--bg2); border-radius:20px 20px 0 0;
  border-top:1px solid var(--border);
  padding-bottom:max(env(safe-area-inset-bottom),20px);
  max-height:88dvh; display:flex; flex-direction:column;
  animation:slideup 0.3s cubic-bezier(0.32,0.72,0,1);
}
@keyframes slideup { from{transform:translateY(100%)} to{transform:translateY(0)} }
.ss-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px 12px; border-bottom:1px solid var(--border); flex-shrink:0;
}
.ss-title { font-size:16px; font-weight:800; }
.ss-title span { color:var(--accent2); }
.ss-close {
  width:30px; height:30px; border-radius:50%;
  border:1px solid var(--border); background:var(--bg3);
  color:var(--muted); font-size:15px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; touch-action:manipulation;
}
.ss-close:active { opacity:0.6; }
/* Tab bar */
.ss-tabs {
  display:flex; border-bottom:1px solid var(--border); flex-shrink:0;
}
.ss-tab {
  flex:1; padding:11px 8px; border:none;
  font-size:13px; font-weight:600; cursor:pointer;
  touch-action:manipulation; transition:all 0.15s;
  border-bottom:2px solid transparent;
}
.ss-tab.active { font-weight:700; border-bottom-color:var(--accent); }
/* Body */
.ss-body { flex:1; min-height:0; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
.ss-body::-webkit-scrollbar { width:3px; }
.ss-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
/* Slot row */
.slot-row {
  display:flex; align-items:center; gap:12px;
  padding:11px; background:var(--bg3); border-radius:12px; border:1px solid var(--border);
}
.slot-thumb {
  width:44px; height:44px; border-radius:10px; flex-shrink:0;
  background:var(--bg2); border:1.5px dashed var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; cursor:pointer; overflow:hidden; touch-action:manipulation;
}
.slot-thumb img { width:100%; height:100%; object-fit:cover; display:none; }
.slot-thumb img.show { display:block; }
.slot-right { flex:1; display:flex; flex-direction:column; gap:5px; }
.slot-lbl { font-size:10px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.slot-inp {
  width:100%; padding:7px 10px;
  background:var(--bg2); border:1px solid var(--border); border-radius:8px;
  color:var(--white); font-size:14px; font-weight:600; outline:none;
  -webkit-user-select:text; user-select:text; transition:border-color 0.2s;
}
.slot-inp:focus { border-color:var(--accent); }
.slot-vis-row { display:flex; align-items:center; justify-content:space-between; }
.slot-vis-lbl { font-size:11px; color:var(--muted); font-weight:500; }
.vis-tog {
  padding:3px 10px; border-radius:50px;
  border:1px solid var(--border); background:var(--bg2);
  color:var(--muted); font-size:11px; font-weight:700;
  cursor:pointer; touch-action:manipulation; transition:all 0.15s;
}
.vis-tog.on { background:rgba(34,197,94,0.15); border-color:rgba(34,197,94,0.4); color:var(--green); }
.vis-tog:active { transform:scale(0.93); }
/* Footer save button */
.ss-foot { flex-shrink:0; padding:10px 16px 4px; }
.ss-save {
  width:100%; padding:14px; border-radius:13px; border:none;
  background:var(--accent); color:#fff; font-size:15px; font-weight:700;
  cursor:pointer; touch-action:manipulation; transition:all 0.15s;
}
.ss-save:active { transform:scale(0.97); }
.ss-save:disabled { opacity:0.4; cursor:not-allowed; }

/* ══ ROUTE MODAL ══ */
#routeModal {
  position:fixed; inset:0; z-index:100;
  background:var(--bg); display:none; flex-direction:column; overflow:hidden;
}
#routeModal.show { display:flex; }
.rm-hdr {
  flex-shrink:0; padding:max(env(safe-area-inset-top),14px) 16px 12px;
  border-bottom:1px solid var(--border); background:var(--bg);
  display:flex; align-items:center; justify-content:space-between;
}
.rm-title { font-size:17px; font-weight:800; }
.rm-title em { font-style:normal; color:var(--accent2); }
.rm-close {
  width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border); background:var(--bg3);
  color:var(--muted); font-size:16px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; touch-action:manipulation;
}
.rm-close:active { opacity:0.6; }
/* Steps */
.rm-steps {
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  gap:6px; padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--border);
}
.rm-step { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--muted); }
.rm-step-n {
  width:20px; height:20px; border-radius:50%;
  border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800;
}
.rm-step.active .rm-step-n { background:var(--accent); border-color:var(--accent); color:#fff; }
.rm-step.done .rm-step-n { background:var(--green); border-color:var(--green); color:#fff; }
.rm-step.active { color:var(--white); }
.rm-step-line { flex:1; height:1px; background:var(--border); max-width:28px; }
/* Summary */
.rm-sum {
  flex-shrink:0; display:flex; align-items:center; justify-content:center;
  gap:10px; padding:7px 16px; background:var(--bg2); border-bottom:1px solid var(--border);
  font-size:12px; font-weight:600; min-height:34px;
}
.rm-sum-item { display:flex; align-items:center; gap:4px; color:var(--muted); }
.rm-sum-val { font-weight:800; color:var(--white); }
.rm-sum-val.blue { color:var(--accent2); }
/* Body */
.rm-body { flex:1 1 0; min-height:0; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch; }
/* Panel */
.rm-panel { display:none; flex-direction:column; gap:12px; }
.rm-panel.show { display:flex; }
.rm-panel-lbl { font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--muted); }
/* Aircraft grid */
.ac-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.ac-btn {
  padding:12px 6px; border-radius:14px; border:1.5px solid var(--border); background:var(--bg2);
  display:flex; flex-direction:column; align-items:center; gap:4px;
  cursor:pointer; touch-action:manipulation; transition:all 0.15s;
}
.ac-btn:active { transform:scale(0.93); }
.ac-btn.sel { border-color:var(--accent); background:rgba(59,130,246,0.12); }
.ac-code {
  width:28px; height:28px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:900; color:#fff; transition:all 0.15s;
}
.ac-label { font-size:10px; font-weight:600; color:var(--muted); text-align:center; }
.ac-planes { font-size:9px; color:var(--muted2); text-align:center; line-height:1.3; margin-top:1px; }
/* Company grid */
.co-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.co-btn {
  padding:12px 6px; border-radius:14px; border:1.5px solid var(--border); background:var(--bg2);
  display:flex; flex-direction:column; align-items:center; gap:5px;
  cursor:pointer; touch-action:manipulation; transition:all 0.15s; min-height:80px;
}
.co-btn:active { transform:scale(0.92); }
.co-btn.sel { border-color:var(--accent); background:rgba(59,130,246,0.12); }
.co-ico {
  width:44px; height:44px; border-radius:10px;
  background:rgba(255,255,255,0.06); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; overflow:hidden;
}
.co-ico img { width:100%; height:100%; object-fit:contain; }
.co-name { font-size:11px; font-weight:700; color:var(--off); text-align:center; line-height:1.2; }
/* Lot groups */
.lot-group { background:var(--bg2); border-radius:14px; border:1px solid var(--border); overflow:hidden; margin-bottom:8px; }
.lot-group-hdr {
  padding:8px 12px; border-bottom:1px solid var(--border);
  font-size:10px; font-weight:700; letter-spacing:1.5px;
  text-transform:uppercase; color:var(--muted);
}
.lot-chips { display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px; }
.lot-chip {
  padding:8px 12px; border-radius:10px;
  border:1.5px solid var(--border); background:var(--bg3);
  color:var(--off); font-size:13px; font-weight:700;
  cursor:pointer; touch-action:manipulation; transition:all 0.12s;
  min-width:44px; text-align:center;
}
.lot-chip:active { transform:scale(0.88); }
.lot-chip.sel { background:rgba(59,130,246,0.22); border-color:var(--accent); color:var(--accent2); }
.lot-chip.blocked { opacity:0.15; pointer-events:none; }
/* Footer */
.rm-foot {
  flex-shrink:0; padding:10px 16px max(env(safe-area-inset-bottom),14px);
  background:var(--bg); border-top:1px solid var(--border);
  display:flex; gap:8px;
}
.rm-back {
  display:none; padding:0 14px; height:52px; border-radius:14px;
  border:1px solid var(--border); background:var(--bg3);
  color:var(--muted); font-size:15px; font-weight:700;
  cursor:pointer; touch-action:manipulation; align-items:center; justify-content:center;
}
.rm-back.show { display:flex; }
.rm-back:active { opacity:0.7; }
#btnNext {
  flex:1; height:52px; border-radius:14px; border:none;
  background:var(--accent); color:#fff;
  font-size:16px; font-weight:700; cursor:pointer;
  touch-action:manipulation; transition:all 0.15s;
  opacity:0.35; pointer-events:none;
}
#btnNext[data-ready] { opacity:1; pointer-events:auto; }
#btnNext:active { transform:scale(0.97); }
#btnSkip {
  display:none; padding:0 12px; height:52px; border-radius:14px;
  border:1px solid var(--border); background:var(--bg3);
  color:var(--muted); font-size:13px; font-weight:600;
  cursor:pointer; touch-action:manipulation; align-items:center; justify-content:center;
}
#btnSkip.show { display:flex; }
#btnSave {
  display:none; flex:1; height:52px; border-radius:14px; border:none;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#fff; font-size:16px; font-weight:700;
  cursor:pointer; touch-action:manipulation; transition:all 0.15s;
  opacity:0.3; pointer-events:none;
}
#btnSave.show { display:block; }
#btnSave[data-ready] { opacity:1; pointer-events:auto; }
#btnSave[data-saving] { opacity:0.5; pointer-events:none; }
#btnSave:active { transform:scale(0.97); }

/* ══ TOAST ══ */
.toast {
  position:fixed; bottom:calc(env(safe-area-inset-bottom)+80px); left:50%;
  transform:translateX(-50%) translateY(10px);
  padding:10px 20px; border-radius:50px;
  font-size:13px; font-weight:600; white-space:nowrap;
  opacity:0; pointer-events:none;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index:999; background:var(--bg3); color:var(--white);
  border:1px solid var(--border); box-shadow:0 8px 28px rgba(0,0,0,0.6);
}
.toast.ok { background:#16a34a; border-color:transparent; }
.toast.er { background:var(--red); border-color:transparent; }
.toast.info { background:#6366f1; border-color:transparent; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<!-- ══ SETUP ══ -->
<div id="setup">
  <div class="s-icon">✈</div>
  <div class="s-title">FTS <span>Arrival</span></div>
  <div class="s-desc">Paste your Apps Script deployment URL to connect.</div>
  <div class="s-lbl">Apps Script URL</div>
  <input class="s-inp" id="urlInp" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocorrect="off" spellcheck="false">
  <button class="s-btn" id="connectBtn" onclick="doConnect()">Connect &amp; Load</button>
  <div class="s-err" id="setupErr"></div>
</div>

<script>

  {g:'Section 3',ids:['19','20','21','22','23']},

  '9':'C','10':'C','11':'C','12':'C','13':'C','14':'C','15':'C','16':'C','17':'C',
};

function ci(c){return CODE.indexOf((c||'B').replace('+',''));}

// ════════════════════════════════════════
//  STORAGE
// ════════════════════════════════════════
function mkSlot(n){return{name:n||'',img:null,visible:true};}
function mkCo(){return{name:'',img:null};}

function loadArr(key,n,mk){
  try{
    var r=JSON.parse(localStorage.getItem(key));
    if(!Array.isArray(r)) return Array.from({length:n},mk);
    return Array.from({length:n},function(_,i){
      var s=r[i]||{}; return Object.assign(mk(),s);
    });
  }catch{return Array.from({length:n},mk);}
}
function saveArr(key,a){localStorage.setItem(key,JSON.stringify(a));}

var SL=loadArr(KS,NSLOTS,mkSlot);
var CO=loadArr(KCO,NCO,mkCo);

// ════════════════════════════════════════
//  SESSION
// ════════════════════════════════════════
function ns(){return{run:false,splits:[],t0:null,lt:null,iv:null,iso:null,tn:0,ut:null,lot:null,ac:null,co:null};}
var S=ns();

// ════════════════════════════════════════
//  QUEUE
// ════════════════════════════════════════
function qg(){try{return JSON.parse(localStorage.getItem(KQ)||'[]');}catch{return[];}}
function qs(q){localStorage.setItem(KQ,JSON.stringify(q));}
function qpush(s){var q=qg();q.push(s);qs(q);qUI();}
function qUI(){
  var n=qg().length;
  var cnt=document.getElementById('syncCnt');
  if(cnt){cnt.textContent=n;cnt.className='s-cnt'+(n?' show':'');}
  var sb=document.getElementById('btnSync');
  if(sb)sb.className=n?'has-q':'';
  var qb=document.getElementById('qBadge');
  if(!qb)return;
  if(n){qb.classList.add('show');var t=document.getElementById('qBadgeTxt');if(t)t.textContent=n+' offline';}
  else qb.classList.remove('show');
}

// ════════════════════════════════════════
//  JSONP — no CORS issues
// ════════════════════════════════════════
function jsonp(url,params,ms){
  ms=ms||10000;
  return new Promise(function(resolve,reject){
    var id='_cb'+Date.now()+'_'+Math.floor(Math.random()*99999);
    var el=document.createElement('script');
    var done=false;
    var t=setTimeout(function(){
      if(done)return; done=true;
      cleanup(); reject(new Error('Timed out'));
    },ms);
    function cleanup(){
      clearTimeout(t);
      if(el.parentNode)el.parentNode.removeChild(el);
      try{delete window[id];}catch(e){window[id]=undefined;}
    }
    window[id]=function(data){
      if(done)return; done=true;
      cleanup(); resolve(data);
    };
    var q=''; Object.keys(params).forEach(function(k){q+=(q?'&':'')+k+'='+encodeURIComponent(params[k]);});
    q+=(q?'&':'')+'callback='+id;
    el.src=url+'?'+q;
    el.onerror=function(){if(done)return;done=true;cleanup();reject(new Error('Script load failed'));};
    document.head.appendChild(el);
  });
}

var URL_='';

function netGet(params){return jsonp(URL_,params,12000);}
function netPost(body){return jsonp(URL_,{action:'saveData',payload:JSON.stringify(body)},12000);}

// ════════════════════════════════════════
//  CONNECT
// ════════════════════════════════════════
function doConnect(){
  var raw=(document.getElementById('urlInp').value||'').trim();
  var errEl=document.getElementById('setupErr');
  var btn=document.getElementById('connectBtn');
  errEl.classList.remove('show');
  if(!raw){errEl.textContent='Please paste your Apps Script URL.';errEl.classList.add('show');return;}
  if(raw.indexOf('script.google.com')===-1){errEl.textContent="Doesn't look like an Apps Script URL.";errEl.classList.add('show');return;}
  var url=raw.replace(/[\/\s]+$/,'').replace(/\/(exec|dev)$/,'')+'/exec';
  btn.textContent='Connecting…'; btn.disabled=true;
  jsonp(url,{action:'headers'},12000)
    .then(function(d){
      if(d.error)throw new Error(d.error);
      if(!d.actions||!d.actions.length)throw new Error('No actions found in sheet');
      localStorage.setItem(KU,url); URL_=url;
      fillSlots(d.actions);
      showApp();
    })
    .catch(function(e){
      errEl.textContent='Failed: '+(e.message||'unknown');
      errEl.classList.add('show');
      btn.textContent='Connect & Load'; btn.disabled=false;
    });
}

function fillSlots(actions){
  actions.forEach(function(a,i){if(i<NSLOTS&&!SL[i].name)SL[i].name=a.name;});
  saveArr(KS,SL);
}

function showApp(){
  document.getElementById('setup').style.display='none';
  document.getElementById('app').classList.add('show');
  buildGrid();
}

// ════════════════════════════════════════
//  SYNC
// ════════════════════════════════════════
var syncing=false;
function doSync(){
  if(syncing){toast('Already syncing…','info');return;}
  var q=qg();
  if(!q.length){toast('Nothing to sync','info');return;}
  syncing=true;
  document.getElementById('btnSync').disabled=true;
  toast('Syncing '+q.length+'…','info');
  var i=0,ok=0,fail=[];
  function next(){
    if(i>=q.length){
      qs(fail);qUI();syncing=false;
      document.getElementById('btnSync').disabled=false;
      if(!fail.length)toast('✓ All '+ok+' synced!','ok');
      else toast(ok+' synced, '+fail.length+' failed','er');
      return;
    }
    var sess=q[i++];
    netPost(sess).then(function(d){
      if(d.error)throw new Error(d.error);
      ok++; next();
    }).catch(function(){fail.push(sess);next();});
  }
  next();
}
window.addEventListener('online',function(){if(qg().length)setTimeout(doSync,2000);});

// ════════════════════════════════════════
//  WAKE LOCK + ORIENTATION
// ════════════════════════════════════════
var _wl=null;
function wakeOn(){
  if('wakeLock' in navigator)navigator.wakeLock.request('screen').then(function(w){_wl=w;}).catch(function(){});
}
function wakeOff(){if(_wl){_wl.release();_wl=null;}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&S.run)wakeOn();});

// ════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════
window.addEventListener('load',function(){
  qUI();
  SL=loadArr(KS,NSLOTS,mkSlot);
  CO=loadArr(KCO,NCO,mkCo);
  URL_=localStorage.getItem(KU)||'';
  try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(function(){});}catch(e){}
  if(URL_){
    showApp();
    jsonp(URL_,{action:'headers'},8000).then(function(d){if(!d.error&&d.actions){fillSlots(d.actions);buildGrid();}}).catch(function(){});
  }
  document.getElementById('imgPick').addEventListener('change',function(){
    if(!this.files||!this.files[0]||_imgIdx<0)return;
    var rd=new FileReader();
    rd.onload=function(ev){
      var img=new Image();
      img.onload=function(){
        var cv=document.createElement('canvas');cv.width=cv.height=128;
        var c=cv.getContext('2d'),s=Math.min(img.width,img.height);
        c.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);
        var b=cv.toDataURL('image/jpeg',0.82);
        if(_imgTarget==='co'){CO[_imgIdx].img=b;saveArr(KCO,CO);refreshCoImg(_imgIdx);}
        else{SL[_imgIdx].img=b;saveArr(KS,SL);buildGrid();refreshSlotImg(_imgIdx);}
      };
      img.src=ev.target.result;
    };
    rd.readAsDataURL(this.files[0]);
    this.value='';
  });
});

// ════════════════════════════════════════
//  GRID
// ════════════════════════════════════════
function buildGrid(){
  var vis=SL.map(function(s,i){return{s:s,i:i};}).filter(function(x){return x.s.visible;});
  var rows=Math.max(1,Math.ceil(vis.length/2));
  var g=document.getElementById('grid');
  g.innerHTML=''; g.style.gridTemplateRows='repeat('+rows+',1fr)';
  vis.forEach(function(x){
    var i=x.i,sl=x.s,empty=!sl.name;
    var b=document.createElement('button');
    b.className='act'+(empty?' empty':'')+(settingsOpen?' emode':'');
    b.id='ab'+i; b.disabled=(!S.run&&!settingsOpen)||empty;
    var imgH=sl.img?'<img class="act-img" src="'+sl.img+'" alt=""><div class="act-overlay"></div>':'';
    b.innerHTML=imgH+'<span class="act-elbl">EDIT</span><span class="act-name">'+(sl.name||'—')+'</span><span class="act-split" id="as'+i+'"></span>';
    b.addEventListener('click',function(){if(settingsOpen)focusSlot(i);else tap(i);});
    g.appendChild(b);
  });
}

// ════════════════════════════════════════
//  TIMER
// ════════════════════════════════════════
function mainClick(){S.run?stop():start();}

function start(){
  if(S.run||settingsOpen)return;
  clearTimeout(S.ut);hideFinish();
  S=ns(); S.run=true; S.t0=S.lt=performance.now(); S.iso=new Date().toISOString();
  S.iv=setInterval(function(){document.getElementById('timer').textContent=fmt(performance.now()-S.t0);},41);
  document.getElementById('timer').className='run'; setSt('run');
  var m=document.getElementById('btnMain');m.textContent='■ Stop';m.classList.add('stp');
  document.getElementById('btnSettings').disabled=true;
  wakeOn();
  SL.forEach(function(_,i){
    var b=document.getElementById('ab'+i);
    if(!b)return;
    b.disabled=!SL[i].name; b.className='act'+(SL[i].name?'':' empty');
    var sp=document.getElementById('as'+i);if(sp)sp.textContent='';
    var n=b.querySelector('.act-num');if(n)n.remove();
  });
}

function stop(){
  if(!S.run)return;
  S.run=false; clearInterval(S.iv); S.iv=null; wakeOff();
  document.getElementById('timer').className='stp'; setSt('stp');
  var m=document.getElementById('btnMain');m.textContent='▶ Start';m.classList.remove('stp');
  document.getElementById('btnSettings').disabled=false;
  SL.forEach(function(_,i){var b=document.getElementById('ab'+i);if(b)b.disabled=true;});
  if(S.splits.length>0){
    var f=document.getElementById('btnFinish');
    f.textContent='✈ Finish Route';f.classList.add('show');f.classList.remove('ready');
    f.style.pointerEvents='none';f.style.opacity='0.4';
    S.ut=setTimeout(function(){f.classList.add('ready');f.style.pointerEvents='';f.style.opacity='';},400);
  }
}
function hideFinish(){var f=document.getElementById('btnFinish');f.classList.remove('show','ready');f.style.pointerEvents='none';f.style.opacity='0.4';}

function tap(i){
  if(!S.run||!SL[i]||!SL[i].name)return;
  var now=performance.now(),total=now-S.t0;
  S.lt=now; S.tn++;
  var name=SL[i].name;
  S.splits=S.splits.filter(function(s){return s.actionName!==name;});
  S.splits.push({actionName:name,deltaMs:total});
  var b=document.getElementById('ab'+i);b.className='act done';
  var sp=document.getElementById('as'+i);if(sp)sp.textContent=fmt(total);
  var badge=b.querySelector('.act-num');
  if(!badge){badge=document.createElement('span');badge.className='act-num';b.appendChild(badge);}
  badge.textContent='#'+S.tn;
}

// ════════════════════════════════════════
//  SETTINGS
// ════════════════════════════════════════
var settingsOpen=false, settingsTab='slots', _imgIdx=-1, _imgTarget='slots';

function openSettings(){
  if(S.run)return;
  settingsOpen=true;
  document.getElementById('btnSettings').classList.add('on');
  buildGrid();
  buildSettingsBody();
  document.getElementById('settingsOverlay').classList.add('show');
  switchTab('slots');
}
function closeSettings(){
  settingsOpen=false;
  document.getElementById('btnSettings').classList.remove('on');
  document.getElementById('settingsOverlay').classList.remove('show');
  buildGrid();
}
function overlayClose(e){if(e.target===document.getElementById('settingsOverlay'))closeSettings();}

function switchTab(tab){
  settingsTab=tab;
  document.getElementById('tabSlots').className='ss-tab'+(tab==='slots'?' active':'');
  document.getElementById('tabCo').className='ss-tab'+(tab==='co'?' active':'');
  buildSettingsBody();
  document.getElementById('ssSave').textContent=tab==='slots'?'Save to Sheet':'Save Companies';
}

function buildSettingsBody(){
  var body=document.getElementById('ssBody'); body.innerHTML='';
  if(settingsTab==='slots'){
    SL.forEach(function(sl,i){
      var row=document.createElement('div'); row.className='slot-row'; row.id='sr'+i;
      // Thumb
      var th=document.createElement('div'); th.className='slot-thumb';
      (function(idx){th.addEventListener('click',function(){_imgIdx=idx;_imgTarget='slots';document.getElementById('imgPick').click();});})(i);
      var im=document.createElement('img'); if(sl.img){im.src=sl.img;im.classList.add('show');}
      var ic=document.createElement('span'); ic.textContent='📷'; if(sl.img)ic.style.display='none';
      th.appendChild(im); th.appendChild(ic);
      // Right
      var rt=document.createElement('div'); rt.className='slot-right';
      var lbl=document.createElement('div'); lbl.className='slot-lbl'; lbl.textContent='Slot '+(i+1);
      var inp=document.createElement('input'); inp.className='slot-inp'; inp.type='text';
      inp.placeholder='Action name…'; inp.value=sl.name||'';
      inp.setAttribute('inputmode','text');
      (function(idx){inp.addEventListener('input',function(){SL[idx].name=this.value.trim();});})(i);
      var visRow=document.createElement('div'); visRow.className='slot-vis-row';
      var visLbl=document.createElement('span'); visLbl.className='slot-vis-lbl'; visLbl.textContent='Show button';
      var tog=document.createElement('button'); tog.className='vis-tog'+(sl.visible?' on':''); tog.textContent=sl.visible?'ON':'OFF';
      (function(idx,t){t.addEventListener('click',function(){SL[idx].visible=!SL[idx].visible;t.className='vis-tog'+(SL[idx].visible?' on':'');t.textContent=SL[idx].visible?'ON':'OFF';});})(i,tog);
      visRow.appendChild(visLbl); visRow.appendChild(tog);
      rt.appendChild(lbl); rt.appendChild(inp); rt.appendChild(visRow);
      row.appendChild(th); row.appendChild(rt); body.appendChild(row);
    });
  } else {
    CO.forEach(function(co,i){
      var row=document.createElement('div'); row.className='slot-row'; row.id='cr'+i;
      var th=document.createElement('div'); th.className='slot-thumb';
      (function(idx){th.addEventListener('click',function(){_imgIdx=idx;_imgTarget='co';document.getElementById('imgPick').click();});})(i);
      var im=document.createElement('img'); if(co.img){im.src=co.img;im.classList.add('show');}
      var ic=document.createElement('span'); ic.textContent='🏢'; if(co.img)ic.style.display='none';
      th.appendChild(im); th.appendChild(ic);
      var rt=document.createElement('div'); rt.className='slot-right';
      var lbl=document.createElement('div'); lbl.className='slot-lbl'; lbl.textContent='Company '+(i+1);
      var inp=document.createElement('input'); inp.className='slot-inp'; inp.type='text';
      inp.placeholder='Company name…'; inp.value=co.name||'';
      inp.setAttribute('inputmode','text');
      (function(idx){inp.addEventListener('input',function(){CO[idx].name=this.value.trim();});})(i);
      rt.appendChild(lbl); rt.appendChild(inp);
      row.appendChild(th); row.appendChild(rt); body.appendChild(row);
    });
  }
}

function saveSettings(){
  var btn=document.getElementById('ssSave');
  btn.disabled=true; btn.textContent='Saving…';
  if(settingsTab==='slots'){
    saveArr(KS,SL);
    if(URL_&&navigator.onLine){
      netPost({action:'updateHeaders',slots:SL.map(function(s){return s.name||'';})})
        .then(function(d){toast(d.error?'Saved locally':'✓ Saved to sheet','ok');})
        .catch(function(){toast('Saved locally','info');})
        .finally(function(){btn.disabled=false;btn.textContent='Save to Sheet';closeSettings();});
    } else {
      saveArr(KS,SL); toast('Saved locally','info');
      btn.disabled=false; btn.textContent='Save to Sheet'; closeSettings();
    }
  } else {
    saveArr(KCO,CO); toast('Companies saved','ok');
    btn.disabled=false; btn.textContent='Save Companies'; closeSettings();
  }
}

function focusSlot(i){
  var el=document.getElementById('sr'+i);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});var inp=el.querySelector('.slot-inp');if(inp)setTimeout(function(){inp.focus();},300);}
}
function refreshSlotImg(i){
  var el=document.querySelector('#sr'+i+' .slot-thumb');if(!el)return;
  var im=el.querySelector('img'),ic=el.querySelector('span');
  if(SL[i].img){im.src=SL[i].img;im.classList.add('show');if(ic)ic.style.display='none';}
}
function refreshCoImg(i){
  var el=document.querySelector('#cr'+i+' .slot-thumb');if(!el)return;
  var im=el.querySelector('img'),ic=el.querySelector('span');
  if(CO[i].img){im.src=CO[i].img;im.classList.add('show');if(ic)ic.style.display='none';}
}

// ════════════════════════════════════════
//  ROUTE MODAL
// ════════════════════════════════════════
var rStep=1;

function openRoute(){
  if(!S.splits.length)return;
  S.ac=null; S.co=null; S.lot=null; rStep=1;
  buildAcGrid(); showStep(1); updSum();
  var bs=document.getElementById('btnSave');
  bs.removeAttribute('data-ready'); bs.removeAttribute('data-saving');
  bs.textContent='✈ Save to Sheet'; bs.classList.remove('show');
  document.getElementById('btnNext').removeAttribute('data-ready');
  document.getElementById('btnNext').textContent='Next →';
  document.getElementById('routeModal').classList.add('show');
}
function closeRoute(){document.getElementById('routeModal').classList.remove('show');}

function showStep(n){
  rStep=n;
  [1,2,3].forEach(function(i){document.getElementById('panel'+i).classList.toggle('show',i===n);});
  document.getElementById('rmBack').classList.toggle('show',n>1);
  var isLast=n===3;
  document.getElementById('btnNext').style.display=isLast?'none':'';
  document.getElementById('btnSkip').className=n===2?'show':'';
  var bs=document.getElementById('btnSave');bs.classList.toggle('show',isLast);
  [1,2,3].forEach(function(i){
    var el=document.getElementById('si'+i);if(!el)return;
    el.className='rm-step'+(i<n?' done':i===n?' active':'');
  });
}
function routeNext(){if(rStep===1){if(!S.ac)return;buildCoGrid();showStep(2);}else if(rStep===2){buildLotGroups();showStep(3);updSave();}}
function routeBack(){if(rStep>1)showStep(rStep-1);}
function skipCo(){S.co=null;buildLotGroups();showStep(3);updSave();}

function buildAcGrid(){
  var el=document.getElementById('acGrid'); el.innerHTML='';
  AC.forEach(function(ac){
    var b=document.createElement('button'); b.className='ac-btn';
    b.innerHTML='<div class="ac-code" style="background:'+ac.color+'">'+ac.code+'</div><div class="ac-label">'+ac.label+'</div><div class="ac-planes">'+ac.planes+'</div>';
    b.addEventListener('click',function(){
      document.querySelectorAll('.ac-btn').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel'); S.ac=ac;
      document.getElementById('btnNext').setAttribute('data-ready','1');
      document.getElementById('btnNext').textContent='Next: Company →';
      document.getElementById('msAc').textContent=ac.code; updSum();
    });
    el.appendChild(b);
  });
}

function buildCoGrid(){
  var el=document.getElementById('coGrid'); el.innerHTML='';
  var hasCo=false;
  CO.forEach(function(co,i){
    if(!co.name)return; hasCo=true;
    var b=document.createElement('button'); b.className='co-btn';
    var imgH=co.img?'<img src="'+co.img+'" style="width:44px;height:44px;object-fit:contain;">':'<div class="co-ico">'+co.name.slice(0,2).toUpperCase()+'</div>';
    b.innerHTML=imgH+'<div class="co-name">'+co.name+'</div>';
    b.addEventListener('click',function(){
      document.querySelectorAll('.co-btn').forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel'); S.co=co.name;
      document.getElementById('msCo').textContent=co.name; updSum();
      setTimeout(function(){buildLotGroups();showStep(3);updSave();},280);
    });
    el.appendChild(b);
  });
  // Always add Unknown option
  var unk=document.createElement('button'); unk.className='co-btn';
  unk.innerHTML='<div class="co-ico">🚫</div><div class="co-name">Unknown</div>';
  unk.addEventListener('click',function(){S.co='Unknown';buildLotGroups();showStep(3);updSave();});
  el.appendChild(unk);
  document.getElementById('btnNext').setAttribute('data-ready','1');
  document.getElementById('btnNext').textContent='Next: Parking →';
}

function buildLotGroups(){
  var el=document.getElementById('lotGroups'); el.innerHTML='';
  var selIdx=ci(S.ac?S.ac.max:'B');
  LOTS.forEach(function(grp){
    var wrap=document.createElement('div'); wrap.className='lot-group';
    var hdr=document.createElement('div'); hdr.className='lot-group-hdr'; hdr.textContent=grp.g;
    wrap.appendChild(hdr);
    var chips=document.createElement('div'); chips.className='lot-chips';
    grp.ids.forEach(function(id){
      var minCode=LOT_MIN[id]||'B', blocked=selIdx<ci(minCode);
      var chip=document.createElement('button');
      chip.className='lot-chip'+(blocked?' blocked':'');
      chip.dataset.v=id; chip.textContent=id;
      if(!blocked)chip.addEventListener('click',function(){
        var v=chip.dataset.v;
        if(S.lot===v){S.lot=null;document.querySelectorAll('.lot-chip').forEach(function(x){x.classList.remove('sel');});}
        else{S.lot=v;document.querySelectorAll('.lot-chip:not(.blocked)').forEach(function(x){x.classList.toggle('sel',x.dataset.v===v);});}
        updSum(); updSave();
      });
      chips.appendChild(chip);
    });
    wrap.appendChild(chips); el.appendChild(wrap);
  });
}

function updSum(){
  document.getElementById('msAc').textContent=S.ac?S.ac.code:'—';
  document.getElementById('msCo').textContent=S.co||'—';
  document.getElementById('msLot').textContent=S.lot||'—';
}
function updSave(){
  var b=document.getElementById('btnSave');
  if(S.lot&&S.ac){b.setAttribute('data-ready','1');b.textContent='✈ Save — Lot '+S.lot;}
  else{b.removeAttribute('data-ready');b.removeAttribute('data-saving');b.textContent='✈ Save to Sheet';}
}

// ════════════════════════════════════════
//  SAVE
// ════════════════════════════════════════
function doSave(){
  var b=document.getElementById('btnSave');
  if(!b.hasAttribute('data-ready')||b.hasAttribute('data-saving'))return;
  if(!S.lot||!S.ac)return;
  b.setAttribute('data-saving','1'); b.removeAttribute('data-ready'); b.textContent='Saving…';
  var sess={startTimeISO:S.iso,splits:S.splits.slice(),parkLot:S.lot,planeSize:S.ac.code,company:S.co||''};
  netPost(sess).then(function(d){
    if(d.error)throw new Error(d.error);
    toast('✓ Saved to row '+d.row,'ok'); closeRoute(); setTimeout(reset,1200);
  }).catch(function(){
    qpush(sess); toast('Offline — queued ('+qg().length+')','info'); closeRoute(); setTimeout(reset,1500);
  });
}

// ════════════════════════════════════════
//  RESET
// ════════════════════════════════════════
function reset(){
  clearTimeout(S.ut); clearInterval(S.iv); S=ns();
  document.getElementById('timer').textContent='0:00.000';
  document.getElementById('timer').className='';
  var m=document.getElementById('btnMain');m.textContent='▶ Start';m.classList.remove('stp');
  document.getElementById('btnSettings').disabled=false;
  var bs=document.getElementById('btnSave');bs.removeAttribute('data-ready');bs.removeAttribute('data-saving');bs.textContent='✈ Save to Sheet';
  hideFinish(); setSt(''); qUI(); buildGrid();
}

// ════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════
function fmt(ms){var t=Math.round(ms);return Math.floor(t/60000)+':'+String(Math.floor((t%60000)/1000)).padStart(2,'0')+'.'+String(t%1000).padStart(3,'0');}
function setSt(type){
  document.getElementById('spill').className='spill'+(type?' '+type:'');
  document.getElementById('sdot').className='sdot'+(type==='run'?' live':type==='stp'?' dead':'');
  document.getElementById('spTxt').textContent=type==='run'?'Running':type==='stp'?'Stopped':'Ready';
}
function toast(msg,type){
  var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+type+' show';
  setTimeout(function(){t.className='toast '+type;},3200);
}
</script>
